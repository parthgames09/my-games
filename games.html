<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;color:#F59E0B;min-height:100vh;padding:15px;position:relative;overflow-x:hidden;}

canvas{position:fixed;top:0;left:0;z-index:-1;}

.header{display:flex;align-items:center;margin-bottom:20px;}
.back-btn{background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);color:#F59E0B;padding:8px 15px;border-radius:20px;cursor:pointer;font-size:13px;margin-right:10px;text-decoration:none;}
.page-title{color:#FFD700;font-size:20px;font-weight:bold;text-shadow:0 0 10px #F59E0B;}

.games-box{background:rgba(10,10,30,0.85);backdrop-filter:blur(10px);border:1px solid rgba(245,158,11,0.4);border-radius:20px;padding:15px;box-shadow:0 8px 32px rgba(245,158,11,0.1);}
.games-title{color:#FFD700;font-size:16px;font-weight:bold;margin-bottom:10px;text-align:center;text-shadow:0 0 10px #F59E0B;}
.search-bar{position:relative;margin-bottom:12px;}
.search-bar input{width:100%;padding:10px 15px 10px 38px;border-radius:25px;border:1px solid rgba(245,158,11,0.3);background:rgba(255,255,255,0.05);color:#FFD700;font-size:13px;outline:none;}
.search-bar input::placeholder{color:#666;}
.search-bar input:focus{border-color:#F59E0B;box-shadow:0 0 10px rgba(245,158,11,0.2);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;}
.no-results{color:#aaa;text-align:center;padding:15px;font-size:13px;display:none;}
.card{background:rgba(255,255,255,0.05);border-radius:15px;padding:14px;margin:10px 0;border:1px solid rgba(245,158,11,0.2);transition:all 0.3s;}
.card:hover{border-color:#F59E0B;box-shadow:0 4px 20px rgba(245,158,11,0.2);}
.btn{padding:10px 20px;font-size:14px;border:none;border-radius:25px;cursor:pointer;margin:6px auto;width:90%;display:block;font-weight:bold;}
.car{background:linear-gradient(45deg,#FF4D4D,#ff7676);color:white;}
.car3d{background:linear-gradient(45deg,#FF8C00,#FFD700);color:black;}
.cricket{background:linear-gradient(45deg,#11998e,#38ef7d);color:white;}
.sierra{background:linear-gradient(45deg,#1565C0,#4fc3f7);color:white;}
.divider{width:60%;height:1px;background:linear-gradient(90deg,transparent,#F59E0B,transparent);margin:8px auto;}
</style>
</head>
<body>

<canvas id="space-bg"></canvas>

<div class="header">
  <a href="index.html" class="back-btn">← Back</a>
  <div class="page-title">🎮 My Games</div>
</div>

<div class="games-box">
  <div class="games-title">All Games</div>
  <div class="divider"></div>

  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search games..." onkeyup="searchGames()">
  </div>

  <div class="card" data-name="car racing">
    <h2 style="color:#FF4D4D;font-size:15px;">🚗 Car Racing</h2>
    <p style="color:#aaa;font-size:11px;margin:5px 0;">Avoid obstacles & beat your high score!</p>
    <a href="car-game.html"><button class="btn car">▶ Play Car Game</button></a>
  </div>

  <div class="card" data-name="3d car racing">
    <h2 style="color:#FFD700;font-size:15px;">🏎️ 3D Car Racing</h2>
    <p style="color:#aaa;font-size:11px;margin:5px 0;">Experience 3D perspective racing!</p>
    <a href="car-3D.html"><button class="btn car3d">▶ Play 3D Car Game</button></a>
  </div>

  <div class="card" data-name="cricket">
    <h2 style="color:#38ef7d;font-size:15px;">🏏 Cricket</h2>
    <p style="color:#aaa;font-size:11px;margin:5px 0;">Hit sixes & score maximum runs!</p>
    <a href="cricket-game.html"><button class="btn cricket">▶ Play Cricket</button></a>
  </div>

  <div class="card" data-name="tata sierra driving">
    <h2 style="color:#4fc3f7;font-size:15px;">🚙 TATA Sierra</h2>
    <p style="color:#aaa;font-size:11px;margin:5px 0;">Drive the legendary TATA Sierra!</p>
    <a href="sierra-game.html"><button class="btn sierra">▶ Play Sierra Game</button></a>
  </div>

  <div class="no-results" id="noResults">😔 No games found!</div>
</div>

<script>
var canvas=document.getElementById('space-bg');
var ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

var stars=[];
for(var i=0;i<200;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*2+0.5,opacity:Math.random(),speed:Math.random()*0.02+0.005});
}

function drawSpace(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  var bg=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  bg.addColorStop(0,'#000005');bg.addColorStop(0.5,'#05001a');bg.addColorStop(1,'#000010');
  ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);
  stars.forEach(function(s){
    s.opacity+=s.speed;
    if(s.opacity>1||s.opacity<0) s.speed*=-1;
    ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+Math.abs(s.opacity)+')';ctx.fill();
  });
  requestAnimationFrame(drawSpace);
}
drawSpace();

function searchGames(){
  var input=document.getElementById('searchInput').value.toLowerCase();
  var cards=document.querySelectorAll('.card');
  var found=0;
  cards.forEach(function(card){
    var name=card.getAttribute('data-name');
    if(name.includes(input)){card.style.display='block';found++;}
    else{card.style.display='none';}
  });
  document.getElementById('noResults').style.display=found==0?'block':'none';
}
</script>

</body>
    </html>
