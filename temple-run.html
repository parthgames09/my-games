<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a2e;text-align:center;font-family:Arial;color:white;overflow:hidden;}
h2{color:#FFD700;margin:8px;font-size:16px;}
#ui{display:flex;justify-content:space-around;padding:5px;background:rgba(0,0,0,0.5);}
#score{color:#FFD700;font-size:14px;}
#coins{color:#FFD700;font-size:14px;}
#lives{color:red;font-size:14px;}
#result{font-size:18px;font-weight:bold;color:red;min-height:25px;margin:3px;}
#controls{padding:8px;}
.btn{padding:8px 15px;font-size:14px;border:none;border-radius:10px;cursor:pointer;margin:3px;}
</style>
</head>
<body>

<h2>🏃 Temple Run!</h2>
<div id="ui">
  <div id="score">🏆 Score: 0</div>
  <div id="coins">🪙 Coins: 0</div>
  <div id="lives">❤️❤️❤️</div>
</div>

<canvas id="game" width="300" height="350" style="background:#2d1b00;border:2px solid gold;display:block;margin:0 auto;"></canvas>

<div id="result"></div>

<div id="controls">
  <button class="btn" onclick="moveLeft()" style="background:#FFD700;color:black;">⬅️ Left</button>
  <button class="btn" onclick="startGame()" style="background:lime;color:black;">▶ START</button>
  <button class="btn" onclick="moveRight()" style="background:#FFD700;color:black;">Right ➡️</button>
</div>
<div style="margin-top:5px;">
  <button class="btn" onclick="jump()" style="background:#FF4D4D;color:white;width:120px;">⬆️ JUMP</button>
  <button class="btn" onclick="slide()" style="background:#4D4DFF;color:white;width:120px;">⬇️ SLIDE</button>
</div>

<script>
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var W=300,H=350;

var score=0,coins=0,lives=3,running=false,speed=3;
var playerX=W/2,playerY=H-80,playerW=30,playerH=50;
var isJumping=false,isSliding=false,jumpV=0;
var obstacles=[],coinsList=[],particles=[];
var frameCount=0,lane=1;
var lanes=[W*0.25,W*0.5,W*0.75];
var bgOffset=0;

function moveLeft(){ if(lane>0){lane--;playerX=lanes[lane];} }
function moveRight(){ if(lane<2){lane++;playerX=lanes[lane];} }

function jump(){
  if(!running||isJumping) return;
  isJumping=true;
  jumpV=-12;
}

function slide(){
  if(!running||isSliding) return;
  isSliding=true;
  setTimeout(function(){isSliding=false;},600);
}

function startGame(){
  score=0;coins=0;lives=3;speed=3;running=true;
  obstacles=[];coinsList=[];particles=[];
  lane=1;playerX=lanes[1];playerY=H-80;
  isJumping=false;isSliding=false;jumpV=0;
  frameCount=0;
  document.getElementById('result').innerHTML='';
  updateUI();
  gameLoop();
}

function updateUI(){
  document.getElementById('score').innerHTML='🏆 Score: '+score;
  document.getElementById('coins').innerHTML='🪙 Coins: '+coins;
  var h='';
  for(var i=0;i<lives;i++) h+='❤️';
  document.getElementById('lives').innerHTML=h;
}

function addParticles(x,y,color){
  for(var i=0;i<8;i++){
    particles.push({x:x,y:y,dx:(Math.random()-0.5)*4,dy:(Math.random()-0.5)*4,life:20,color:color});
  }
}

function drawBackground(){
  // Sky
  ctx.fillStyle='#1a0a00';
  ctx.fillRect(0,0,W,H*0.4);

  // Temple walls
  ctx.fillStyle='#3d2b1f';
  ctx.fillRect(0,H*0.4,W*0.2,H);
  ctx.fillRect(W*0.8,H*0.4,W*0.2,H);

  // Ground
  var grd=ctx.createLinearGradient(0,H*0.4,0,H);
  grd.addColorStop(0,'#5c3d1e');
  grd.addColorStop(1,'#2d1b00');
  ctx.fillStyle=grd;
  ctx.fillRect(W*0.2,H*0.4,W*0.6,H);

  // Moving floor lines
  bgOffset=(bgOffset+speed)%(H/5);
  ctx.strokeStyle='rgba(255,200,100,0.2)';
  ctx.lineWidth=1;
  for(var i=0;i<8;i++){
    var y=H*0.4+i*(H/5)+bgOffset;
    if(y<H){
      ctx.beginPath();
      ctx.moveTo(W*0.2,y);
      ctx.lineTo(W*0.8,y);
      ctx.stroke();
    }
  }

  // Lane lines
  ctx.strokeStyle='rgba(255,200,100,0.15)';
  ctx.lineWidth=1;
  ctx.setLineDash([5,10]);
  ctx.beginPath();ctx.moveTo(W*0.4,H*0.4);ctx.lineTo(W*0.4,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W*0.6,H*0.4);ctx.lineTo(W*0.6,H);ctx.stroke();
  ctx.setLineDash([]);

  // Torches
  ctx.fillStyle='#ff6600';
  ctx.beginPath();ctx.arc(W*0.2,H*0.45,5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(W*0.8,H*0.45,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,150,0,0.3)';
  ctx.beginPath();ctx.arc(W*0.2,H*0.45,12,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(W*0.8,H*0.45,12,0,Math.PI*2);ctx.fill();
}

function drawPlayer(){
  var py=playerY;
  var ph=isSliding?playerH*0.5:playerH;
  var slideY=isSliding?playerY+playerH*0.5:playerY;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(playerX,H-55,15,5,0,0,Math.PI*2);
  ctx.fill();

  // Body
  ctx.fillStyle=isSliding?'#FF6B35':'#FF4500';
  ctx.fillRect(playerX-playerW/2,slideY,playerW,ph);

  // Head
  if(!isSliding){
    ctx.fillStyle='#FFCC80';
    ctx.beginPath();
    ctx.arc(playerX,py-10,12,0,Math.PI*2);
    ctx.fill();
    // Eyes
    ctx.fillStyle='black';
    ctx.beginPath();ctx.arc(playerX-4,py-12,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(playerX+4,py-12,2,0,Math.PI*2);ctx.fill();
    // Hair
    ctx.fillStyle='#333';
    ctx.fillRect(playerX-12,py-22,24,8);
  }

  // Legs running animation
  if(!isSliding){
    ctx.fillStyle='#333';
    var legOff=Math.sin(frameCount*0.3)*8;
    ctx.fillRect(playerX-10,slideY+ph,8,15+legOff);
    ctx.fillRect(playerX+2,slideY+ph,8,15-legOff);
  }
}

function drawObstacles(){
  obstacles.forEach(function(ob){
    if(ob.type=='wall'){
      // Wall obstacle
      ctx.fillStyle='#8B4513';
      ctx.fillRect(ob.x-20,ob.y,40,50);
      ctx.fillStyle='#A0522D';
      ctx.fillRect(ob.x-18,ob.y+2,36,46);
      // Spikes on top
      ctx.fillStyle='#666';
      for(var i=0;i<4;i++){
        ctx.beginPath();
        ctx.moveTo(ob.x-15+i*10,ob.y);
        ctx.lineTo(ob.x-10+i*10,ob.y-12);
        ctx.lineTo(ob.x-5+i*10,ob.y);
        ctx.fill();
      }
    } else if(ob.type=='fire'){
      // Fire obstacle
      ctx.fillStyle='#FF4500';
      ctx.beginPath();
      ctx.arc(ob.x,ob.y+15,15,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#FF6600';
      ctx.beginPath();
      ctx.arc(ob.x,ob.y+10,10,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#FFD700';
      ctx.beginPath();
      ctx.arc(ob.x,ob.y+8,6,0,Math.PI*2);
      ctx.fill();
    } else if(ob.type=='low'){
      // Low obstacle - need to jump
      ctx.fillStyle='#8B0000';
      ctx.fillRect(ob.x-25,ob.y+20,50,20);
      ctx.fillStyle='#B22222';
      ctx.fillRect(ob.x-23,ob.y+22,46,16);
    }
  });
}

function drawCoins(){
  coinsList.forEach(function(c){
    ctx.fillStyle='#FFD700';
    ctx.beginPath();
    ctx.arc(c.x,c.y,8,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#FFA500';
    ctx.beginPath();
    ctx.arc(c.x,c.y,5,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='white';
    ctx.font='bold 7px Arial';
    ctx.textAlign='center';
    ctx.fillText('$',c.x,c.y+3);
  });
}

function drawParticles(){
  particles.forEach(function(p){
    ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
    p.x+=p.dx;p.y+=p.dy;p.life--;
  });
  particles=particles.filter(function(p){return p.life>0;});
}

function gameLoop(){
  if(!running) return;
  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawObstacles();
  drawCoins();
  drawParticles();
  drawPlayer();

  frameCount++;

  // Jump physics
  if(isJumping){
    playerY+=jumpV;
    jumpV+=0.8;
    if(playerY>=H-80){
      playerY=H-80;
      isJumping=false;
      jumpV=0;
    }
  }

  // Spawn obstacles
  if(frameCount%80==0){
    var types=['wall','fire','low'];
    var type=types[Math.floor(Math.random()*3)];
    var obLane=lanes[Math.floor(Math.random()*3)];
    obstacles.push({x:obLane,y:H*0.4,type:type,speed:speed});
  }

  // Spawn coins
  if(frameCount%50==0){
    var coinLane=lanes[Math.floor(Math.random()*3)];
    coinsList.push({x:coinLane,y:H*0.4});
  }

  // Move obstacles
  obstacles.forEach(function(ob,i){
    ob.y+=speed;

    // Collision
    var ph=isSliding?playerH*0.5:playerH;
    var slideY=isSliding?playerY+playerH*0.5:playerY;

    if(Math.abs(ob.x-playerX)<25 && ob.y+30>slideY && ob.y<slideY+ph){
      if(ob.type=='low' && isJumping) return;
      if(ob.type=='wall' && isSliding) return;
      obstacles.splice(i,1);
      lives--;
      addParticles(playerX,playerY,'red');
      updateUI();
      if(lives<=0){
        running=false;
        document.getElementById('result').innerHTML='💀 Game Over! Score: '+score+' | Coins: '+coins;
        return;
      }
    }
    if(ob.y>H) obstacles.splice(i,1);
  });

  // Move coins
  coinsList.forEach(function(c,i){
    c.y+=speed;
    if(Math.abs(c.x-playerX)<20 && Math.abs(c.y-playerY)<30){
      coinsList.splice(i,1);
      coins++;
      addParticles(c.x,c.y,'gold');
      updateUI();
    }
    if(c.y>H) coinsList.splice(i,1);
  });

  // Score
  if(frameCount%30==0){
    score++;
    speed+=0.01;
    updateUI();
  }

  requestAnimationFrame(gameLoop);
}
</script>
</body>
  </html>
