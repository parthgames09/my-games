<html>
<body style="background:black; text-align:center; margin:0; padding:0;">

<h3 style="color:yellow; margin:3px;">🚗 Racing!</h3>

<canvas id="game" width="300" height="400" style="background:#333; border:2px solid yellow;"></canvas>

<h3 id="score" style="color:yellow; margin:2px; font-size:14px;">Score: 0</h3>
<h3 id="gameover" style="color:red; margin:2px; font-size:12px;"></h3>

<button onclick="moveCar(-20)" style="padding:10px 25px; font-size:18px; background:yellow; border:none; margin:5px;">◀</button>
<button onclick="startGame()" style="padding:10px 15px; font-size:16px; background:lime; border:none; margin:5px;">GO</button>
<button onclick="moveCar(20)" style="padding:10px 25px; font-size:18px; background:yellow; border:none; margin:5px;">▶</button>

<script>
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var car={x:130,y:330,width:35,height:55};
var obstacles=[];
var score=0;
var running=false;
var speed=2;

function moveCar(dir){
  if(car.x+dir>5&&car.x+dir<260) car.x+=dir;
}

function startGame(){
  car.x=130;
  obstacles=[];
  score=0;
  speed=2;
  running=true;
  document.getElementById('gameover').innerHTML='';
  document.getElementById('score').innerHTML='Score: 0';
  gameLoop();
}

function drawCar(x,y,col){
  ctx.fillStyle=col;
  ctx.fillRect(x+5,y,25,55);
  ctx.fillRect(x,y+10,35,25);
  ctx.fillStyle='lightblue';
  ctx.fillRect(x+7,y+3,21,15);
  ctx.fillStyle='#111';
  ctx.fillRect(x,y+8,8,14);
  ctx.fillRect(x+27,y+8,8,14);
  ctx.fillRect(x,y+33,8,14);
  ctx.fillRect(x+27,y+33,8,14);
  ctx.fillStyle='yellow';
  ctx.fillRect(x+5,y+48,8,5);
  ctx.fillRect(x+22,y+48,8,5);
}

function gameLoop(){
  if(!running) return;
  ctx.clearRect(0,0,300,400);
  ctx.fillStyle='#444';
  ctx.fillRect(0,0,300,400);
  ctx.fillStyle='white';
  ctx.fillRect(15,0,3,400);
  ctx.fillRect(282,0,3,400);
  ctx.fillStyle='yellow';
  ctx.fillRect(148,0,4,400);

  drawCar(car.x,car.y,'red');

  if(Math.random()<0.02){
    obstacles.push({x:20+Math.floor(Math.random()*230),y:-55});
  }

  obstacles.forEach(function(ob,i){
    ob.y+=speed;
    drawCar(ob.x,ob.y,'blue');

    if(ob.x<car.x+35&&ob.x+35>car.x&&ob.y<car.y+55&&ob.y+55>car.y){
      running=false;
      document.getElementById('gameover').innerHTML='💥 Game Over! Score: '+score;
    }

    if(ob.y>400){
      obstacles.splice(i,1);
      score++;
      speed+=0.1;
      document.getElementById('score').innerHTML='Score: '+score;
    }
  });
  requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>
