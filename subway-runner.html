<!DOCTYPE html>
<html>
<head>
    <title>3D Endless Runner</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 24px;
            font-family: Arial;
        }
    </style>
</head>
<body>

<div id="score">Score: 0</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5,10,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,1));

// Road
const roadGeo = new THREE.BoxGeometry(12,1,300);
const roadMat = new THREE.MeshStandardMaterial({ color:0x444444 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.position.z = -120;
scene.add(road);

// Lane lines
for(let i=-1;i<=1;i++){
    const lineGeo = new THREE.BoxGeometry(0.2,0.1,300);
    const lineMat = new THREE.MeshBasicMaterial({color:0xffffff});
    const line = new THREE.Mesh(lineGeo,lineMat);

    if(i!==0){
        line.position.x = i*2;
        line.position.y = 0.55;
        line.position.z = -120;
        scene.add(line);
    }
}

// Player
const player = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshStandardMaterial({ color:0xff0000 })
);

player.position.y = 1;
scene.add(player);

// Camera
camera.position.set(0,5,8);
camera.lookAt(0,1,0);

let lane = 0;
const lanes = [-3,0,3];

let velocityY = 0;
let jumping = false;

document.addEventListener("keydown",(e)=>{

    if(e.key==="ArrowLeft" && lane>0){
        lane--;
    }

    if(e.key==="ArrowRight" && lane<2){
        lane++;
    }

    if(e.code==="Space" && !jumping){
        velocityY = 0.25;
        jumping = true;
    }
});

// Obstacles
const obstacles = [];

function createObstacle(){

    const obs = new THREE.Mesh(
        new THREE.BoxGeometry(1.5,2,1.5),
        new THREE.MeshStandardMaterial({ color:0x00ff00 })
    );

    obs.position.x = lanes[Math.floor(Math.random()*3)];
    obs.position.y = 1;
    obs.position.z = -80;

    scene.add(obs);
    obstacles.push(obs);
}

setInterval(createObstacle,1000);

let score = 0;

function animate(){

    requestAnimationFrame(animate);

    player.position.x +=
        (lanes[lane] - player.position.x)*0.2;

    // Jump physics
    if(jumping){
        player.position.y += velocityY;
        velocityY -= 0.015;

        if(player.position.y <= 1){
            player.position.y = 1;
            jumping = false;
            velocityY = 0;
        }
    }

    // Obstacles movement
    for(let i=obstacles.length-1;i>=0;i--){

        obstacles[i].position.z += 0.8;

        const dx =
            obstacles[i].position.x - player.position.x;

        const dz =
            obstacles[i].position.z - player.position.z;

        const dy =
            obstacles[i].position.y - player.position.y;

        const distance =
            Math.sqrt(dx*dx+dy*dy+dz*dz);

        if(distance < 1.5){
            alert("Game Over! Score: " + score);
            location.reload();
        }

        if(obstacles[i].position.z > 10){

            scene.remove(obstacles[i]);
            obstacles.splice(i,1);

            score++;
            document.getElementById("score").innerText =
                "Score: " + score;
        }
    }

    renderer.render(scene,camera);
}

animate();

</script>

</body>
  </html>
