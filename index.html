<html>
<head>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;min-height:100vh;position:relative;overflow-x:hidden;display:flex;align-items:center;justify-content:center;}

canvas{position:fixed;top:0;left:0;z-index:-1;}

.main-card{background:rgba(10,10,30,0.90);backdrop-filter:blur(15px);border:1px solid rgba(245,158,11,0.3);border-radius:20px;padding:30px 25px;width:90%;max-width:420px;box-shadow:0 8px 32px rgba(245,158,11,0.1);}

.logo-section{display:flex;align-items:center;margin-bottom:15px;}
.logo{width:55px;height:55px;border-radius:50%;border:3px solid #F59E0B;box-shadow:0 0 15px rgba(245,158,11,0.5);object-fit:cover;margin-right:12px;}
.logo-text{text-align:left;}
.site-name{color:#FFD700;font-size:20px;font-weight:bold;text-shadow:0 0 10px #F59E0B;}
.site-url{color:#666;font-size:11px;margin-top:2px;}

.description{color:#aaa;font-size:13px;line-height:1.6;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,0.08);}

.menu-item{display:flex;align-items:center;justify-content:space-between;padding:16px 5px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer;transition:all 0.2s;text-decoration:none;}
.menu-item:last-child{border-bottom:none;}
.menu-item:hover{padding-left:10px;}
.menu-left{display:flex;align-items:center;gap:12px;}
.menu-icon{font-size:22px;}
.menu-text{color:#F59E0B;font-size:15px;font-weight:500;}
.menu-desc{color:#666;font-size:11px;margin-top:2px;}
.menu-arrow{color:#666;font-size:18px;}
</style>
</head>
<body>

<canvas id="space-bg"></canvas>

<div class="main-card">

  <!-- Logo + Name -->
  <div class="logo-section">
    <img class="logo" src="ChatGPTImageMay30202601_54_36P.jpeg" alt="Parth">
    <div class="logo-text">
      <div class="site-name">🎮 Parth's Game Zone</div>
      <div class="site-url">parthgames09.github.io/my-games</div>
    </div>
  </div>

  <!-- Description -->
  <div class="description">
    Welcome to Parth's Game Zone — play awesome games, learn about the creator, and explore more!
  </div>

  <!-- Menu Options -->
  <a href="games.html" class="menu-item">
    <div class="menu-left">
      <span class="menu-icon">🎮</span>
      <div>
        <div class="menu-text">Games</div>
        <div class="menu-desc">Play all 4 games</div>
      </div>
    </div>
    <span class="menu-arrow">›</span>
  </a>

  <a href="about.html" class="menu-item">
    <div class="menu-left">
      <span class="menu-icon">👤</span>
      <div>
        <div class="menu-text">About Me</div>
        <div class="menu-desc">Know more about Parth</div>
      </div>
    </div>
    <span class="menu-arrow">›</span>
  </a>

  <a href="mailto:parthhuu.2009@gmail.com" class="menu-item">
    <div class="menu-left">
      <span class="menu-icon">📩</span>
      <div>
        <div class="menu-text">Contact</div>
        <div class="menu-desc">parthhuu.2009@gmail.com</div>
      </div>
    </div>
    <span class="menu-arrow">›</span>
  </a>

</div>

<script>
var canvas=document.getElementById('space-bg');
var ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

var stars=[];
for(var i=0;i<200;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*2+0.5,opacity:Math.random(),speed:Math.random()*0.02+0.005});
}

var planets=[
  {x:canvas.width*0.08,y:canvas.height*0.2,r:45,type:'earth'},
  {x:canvas.width*0.92,y:canvas.height*0.15,r:25,type:'mars'},
  {x:canvas.width*0.85,y:canvas.height*0.75,r:30,type:'saturn'},
  {x:canvas.width*0.12,y:canvas.height*0.8,r:18,type:'moon'},
];

function drawEarth(x,y,r){
  var grad=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
  grad.addColorStop(0,'#4fc3f7');grad.addColorStop(0.5,'#1565C0');grad.addColorStop(1,'#0a2a6e');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
  ctx.fillStyle='#2e7d32';
  ctx.beginPath();ctx.ellipse(x-r*0.2,y-r*0.1,r*0.3,r*0.4,0.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+r*0.2,y+r*0.1,r*0.25,r*0.35,0.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.beginPath();ctx.ellipse(x+r*0.1,y-r*0.3,r*0.35,r*0.1,0.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x,y,r+4,0,Math.PI*2);
  ctx.strokeStyle='rgba(100,180,255,0.3)';ctx.lineWidth=6;ctx.stroke();
}

function drawMars(x,y,r){
  var grad=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
  grad.addColorStop(0,'#ff6b35');grad.addColorStop(0.6,'#c0392b');grad.addColorStop(1,'#7b241c');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
}

function drawSaturn(x,y,r){
  ctx.beginPath();ctx.ellipse(x,y,r*2.2,r*0.4,0,0,Math.PI*2);
  ctx.strokeStyle='rgba(210,180,140,0.5)';ctx.lineWidth=8;ctx.stroke();
  var grad=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
  grad.addColorStop(0,'#f5deb3');grad.addColorStop(0.5,'#d4a017');grad.addColorStop(1,'#8b6914');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.ellipse(x,y+r*0.1,r*2.2,r*0.4,0,0,Math.PI);
  ctx.strokeStyle='rgba(210,180,140,0.6)';ctx.lineWidth=8;ctx.stroke();
}

function drawMoon(x,y,r){
  var grad=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
  grad.addColorStop(0,'#e0e0e0');grad.addColorStop(0.7,'#aaa');grad.addColorStop(1,'#777');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();ctx.arc(x+r*0.2,y-r*0.2,r*0.2,0,Math.PI*2);ctx.fill();
}

function drawSpace(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  var bg=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  bg.addColorStop(0,'#000005');bg.addColorStop(0.5,'#05001a');bg.addColorStop(1,'#000010');
  ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);
  stars.forEach(function(s){
    s.opacity+=s.speed;
    if(s.opacity>1||s.opacity<0) s.speed*=-1;
    ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+Math.abs(s.opacity)+')';ctx.fill();
  });
  planets.forEach(function(p){
    if(p.type=='earth') drawEarth(p.x,p.y,p.r);
    else if(p.type=='mars') drawMars(p.x,p.y,p.r);
    else if(p.type=='saturn') drawSaturn(p.x,p.y,p.r);
    else if(p.type=='moon') drawMoon(p.x,p.y,p.r);
  });
  requestAnimationFrame(drawSpace);
}
drawSpace();
</script>

</body>
</html>
