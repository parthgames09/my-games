<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#000;font-family:Arial;}
#ui{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,0.7);border:2px solid #FFD700;border-radius:15px;padding:8px 20px;display:flex;gap:20px;backdrop-filter:blur(10px);}
.ui-item{text-align:center;}
.ui-label{color:#aaa;font-size:10px;}
.ui-val{font-size:16px;font-weight:bold;}
#screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);}
#screen h1{color:#FFD700;font-size:28px;text-shadow:0 0 20px gold;margin-bottom:10px;}
#screen p{color:#aaa;font-size:14px;margin-bottom:20px;}
.big-btn{padding:15px 40px;font-size:20px;border:none;border-radius:25px;cursor:pointer;font-weight:bold;margin:8px;}
#controls{position:fixed;bottom:15px;left:0;right:0;text-align:center;z-index:10;}
.ctrl-btn{padding:15px 30px;font-size:20px;border:none;border-radius:15px;cursor:pointer;margin:5px;font-weight:bold;opacity:0.9;}
#jump-btn{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:10;padding:12px 40px;font-size:18px;border:none;border-radius:15px;cursor:pointer;font-weight:bold;background:#FF4D4D;color:white;}
</style>
</head>
<body>

<div id="ui">
  <div class="ui-item">
    <div class="ui-label">🏆 SCORE</div>
    <div class="ui-val" id="scoreVal" style="color:#FFD700;">0</div>
  </div>
  <div class="ui-item">
    <div class="ui-label">👑 BEST</div>
    <div class="ui-val" id="bestVal" style="color:#FF4D4D;">0</div>
  </div>
  <div class="ui-item">
    <div class="ui-label">🪙 COINS</div>
    <div class="ui-val" id="coinsVal" style="color:#00FF85;">0</div>
  </div>
  <div class="ui-item">
    <div class="ui-label">❤️ LIVES</div>
    <div class="ui-val" id="livesVal" style="color:#FF4D4D;">3</div>
  </div>
</div>

<div id="screen">
  <h1>🏃 Subway Run!</h1>
  <p>Run, Jump & Dodge obstacles!</p>
  <button class="big-btn" onclick="startGame()" style="background:linear-gradient(45deg,#FFD700,#FF8C00);color:black;">▶ START GAME</button>
</div>

<button id="jump-btn" onclick="jump()" style="display:none;">⬆️ JUMP</button>

<div id="controls" style="display:none;">
  <button class="ctrl-btn" onclick="moveLeft()" style="background:#FFD700;color:black;">⬅️ LEFT</button>
  <button class="ctrl-btn" onclick="slide()" style="background:#4D4DFF;color:white;">⬇️ SLIDE</button>
  <button class="ctrl-btn" onclick="moveRight()" style="background:#FFD700;color:black;">RIGHT ➡️</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Scene Setup
var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87CEEB, 0.02);

var camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 8);
camera.lookAt(0, 1, 0);

var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lights
var ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

var sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
sunLight.position.set(10, 20, 10);
sunLight.castShadow = true;
scene.add(sunLight);

var pointLight1 = new THREE.PointLight(0xFF8C00, 1, 30);
pointLight1.position.set(-5, 5, 0);
scene.add(pointLight1);

// Sky
var skyGeo = new THREE.SphereGeometry(500, 32, 32);
var skyMat = new THREE.MeshBasicMaterial({
  color: 0x87CEEB,
  side: THREE.BackSide
});
var sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// Ground
var groundGeo = new THREE.PlaneGeometry(20, 1000);
var groundMat = new THREE.MeshLambertMaterial({color: 0x808080});
var ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.set(0, -0.5, -490);
ground.receiveShadow = true;
scene.add(ground);

// Road lines
function makeRoadLine(x){
  var geo = new THREE.BoxGeometry(0.15, 0.02, 1000);
  var mat = new THREE.MeshLambertMaterial({color: 0xFFFFFF});
  var line = new THREE.Mesh(geo, mat);
  line.position.set(x, -0.48, -490);
  scene.add(line);
}
makeRoadLine(-1.5);
makeRoadLine(1.5);

// Road borders
[-5, 5].forEach(function(x){
  var geo = new THREE.BoxGeometry(0.3, 0.5, 1000);
  var mat = new THREE.MeshLambertMaterial({color: 0xFF4D4D});
  var wall = new THREE.Mesh(geo, mat);
  wall.position.set(x, -0.25, -490);
  scene.add(wall);
});

// Buildings
function makeBuilding(x, z){
  var h = 5 + Math.random()*15;
  var geo = new THREE.BoxGeometry(3+Math.random()*2, h, 3+Math.random()*2);
  var colors = [0x4a4a8a, 0x6a6a4a, 0x8a4a4a, 0x4a8a4a, 0x8a8a4a];
  var mat = new THREE.MeshLambertMaterial({color: colors[Math.floor(Math.random()*colors.length)]});
  var building = new THREE.Mesh(geo, mat);
  building.position.set(x, h/2-0.5, z);
  building.castShadow = true;
  scene.add(building);

  // Windows
  var winGeo = new THREE.BoxGeometry(0.4, 0.4, 0.1);
  var winMat = new THREE.MeshBasicMaterial({color: 0xFFFF88});
  for(var i=0; i<3; i++){
    for(var j=0; j<Math.floor(h/2); j++){
      var win = new THREE.Mesh(winGeo, winMat);
      win.position.set(x + (i-1)*0.8, j*1.5+0.5, z + 1.6);
      scene.add(win);
    }
  }
  return building;
}

// Make buildings on sides
for(var i=0; i<20; i++){
  makeBuilding(-8-Math.random()*3, -i*15);
  makeBuilding(8+Math.random()*3, -i*15);
}

// Player Character
function makePlayer(){
  var player = new THREE.Group();

  // Body
  var bodyGeo = new THREE.BoxGeometry(0.6, 0.8, 0.4);
  var bodyMat = new THREE.MeshLambertMaterial({color: 0xFF4500});
  var body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.4;
  body.castShadow = true;
  player.add(body);

  // Head
  var headGeo = new THREE.SphereGeometry(0.25, 8, 8);
  var headMat = new THREE.MeshLambertMaterial({color: 0xFFCC80});
  var head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 1.1;
  head.castShadow = true;
  player.add(head);

  // Hair
  var hairGeo = new THREE.SphereGeometry(0.27, 8, 4, 0, Math.PI*2, 0, Math.PI/2);
  var hairMat = new THREE.MeshLambertMaterial({color: 0x333333});
  var hair = new THREE.Mesh(hairGeo, hairMat);
  hair.position.y = 1.2;
  player.add(hair);

  // Eyes
  var eyeGeo = new THREE.SphereGeometry(0.05, 6, 6);
  var eyeMat = new THREE.MeshBasicMaterial({color: 0x000000});
  var leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.1, 1.15, 0.22);
  player.add(leftEye);
  var rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(0.1, 1.15, 0.22);
  player.add(rightEye);

  // Left Arm
  var armGeo = new THREE.BoxGeometry(0.2, 0.6, 0.2);
  var armMat = new THREE.MeshLambertMaterial({color: 0xFF4500});
  var leftArm = new THREE.Mesh(armGeo, armMat);
  leftArm.position.set(-0.4, 0.4, 0);
  player.add(leftArm);
  var rightArm = new THREE.Mesh(armGeo, armMat);
  rightArm.position.set(0.4, 0.4, 0);
  player.add(rightArm);

  // Legs
  var legGeo = new THREE.BoxGeometry(0.25, 0.6, 0.25);
  var legMat = new THREE.MeshLambertMaterial({color: 0x1565C0});
  var leftLeg = new THREE.Mesh(legGeo, legMat);
  leftLeg.position.set(-0.18, -0.3, 0);
  player.add(leftLeg);
  var rightLeg = new THREE.Mesh(legGeo, legMat);
  rightLeg.position.set(0.18, -0.3, 0);
  player.add(rightLeg);

  // Shoes
  var shoeGeo = new THREE.BoxGeometry(0.28, 0.15, 0.35);
  var shoeMat = new THREE.MeshLambertMaterial({color: 0x333333});
  var leftShoe = new THREE.Mesh(shoeGeo, shoeMat);
  leftShoe.position.set(-0.18, -0.65, 0.05);
  player.add(leftShoe);
  var rightShoe = new THREE.Mesh(shoeGeo, shoeMat);
  rightShoe.position.set(0.18, -0.65, 0.05);
  player.add(rightShoe);

  return {
    group: player,
    body: body,
    leftArm: leftArm,
    rightArm: rightArm,
    leftLeg: leftLeg,
    rightLeg: rightLeg
  };
}

var playerObj = makePlayer();
scene.add(playerObj.group);
playerObj.group.position.set(0, 0.5, 3);

// Game Variables
var score = 0, best = 0, coins = 0, lives = 3;
var running = false;
var speed = 0.2;
var playerLane = 1;
var laneX = [-3, 0, 3];
var targetX = 0;
var isJumping = false, isSliding = false;
var jumpVelocity = 0;
var obstacles = [], coinMeshes = [];
var frameCount = 0;
var animFrame = 0;

// Obstacle types
function makeObstacle(lane){
  var type = Math.floor(Math.random()*3);
  var ob = new THREE.Group();

  if(type == 0){
    // Wall — must jump
    var geo = new THREE.BoxGeometry(2.5, 1.5, 0.5);
    var mat = new THREE.MeshLambertMaterial({color: 0x8B4513});
    var mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    ob.add(mesh);
    ob.userData.type = 'wall';
    ob.userData.height = 1.5;
  } else if(type == 1){
    // Low barrier — must slide
    var geo = new THREE.BoxGeometry(2.5, 0.4, 0.5);
    var mat = new THREE.MeshLambertMaterial({color: 0xFF4D4D});
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 0.8;
    ob.add(mesh);
    ob.userData.type = 'low';
    ob.userData.height = 0.4;
  } else {
    // Train car
    var geo = new THREE.BoxGeometry(2.2, 2, 3);
    var mat = new THREE.MeshLambertMaterial({color: 0x1565C0});
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 0.5;
    ob.add(mesh);

    // Windows on train
    var winGeo = new THREE.BoxGeometry(0.4, 0.4, 0.1);
    var winMat = new THREE.MeshBasicMaterial({color: 0xFFFF88});
    for(var i=0; i<3; i++){
      var win = new THREE.Mesh(winGeo, winMat);
      win.position.set(-0.6+i*0.6, 0.8, 1.6);
      ob.add(win);
    }
    ob.userData.type = 'train';
    ob.userData.height = 2;
  }

  ob.position.set(laneX[lane], 0, -30);
  scene.add(ob);
  obstacles.push(ob);
}

// Coin
function makeCoin(lane){
  var geo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 12);
  var mat = new THREE.MeshLambertMaterial({
    color: 0xFFD700,
    emissive: 0x443300
  });
  var coin = new THREE.Mesh(geo, mat);
  coin.rotation.x = Math.PI/2;
  coin.position.set(laneX[lane], 0.8, -30);
  scene.add(coin);
  coinMeshes.push(coin);
}

// Controls
function moveLeft(){
  if(!running || playerLane <= 0) return;
  playerLane--;
  targetX = laneX[playerLane];
}

function moveRight(){
  if(!running || playerLane >= 2) return;
  playerLane++;
  targetX = laneX[playerLane];
}

function jump(){
  if(!running || isJumping || isSliding) return;
  isJumping = true;
  jumpVelocity = 0.2;
}

function slide(){
  if(!running || isJumping || isSliding) return;
  isSliding = true;
  setTimeout(function(){ isSliding = false; }, 600);
}

function startGame(){
  score=0; best=Math.max(best,score); coins=0; lives=3; speed=0.2;
  running=true; playerLane=1; targetX=0; frameCount=0;
  isJumping=false; isSliding=false; jumpVelocity=0;

  obstacles.forEach(function(o){ scene.remove(o); });
  obstacles=[];
  coinMeshes.forEach(function(c){ scene.remove(c); });
  coinMeshes=[];

  playerObj.group.position.set(0, 0.5, 3);

  document.getElementById('screen').style.display='none';
  document.getElementById('controls').style.display='block';
  document.getElementById('jump-btn').style.display='block';
  updateUI();
}

function updateUI(){
  document.getElementById('scoreVal').innerHTML=score;
  document.getElementById('bestVal').innerHTML=best;
  document.getElementById('coinsVal').innerHTML=coins;
  document.getElementById('livesVal').innerHTML='❤️'.repeat(lives);
}

function gameOver(){
  running=false;
  if(score>best) best=score;
  document.getElementById('controls').style.display='none';
  document.getElementById('jump-btn').style.display='none';
  document.getElementById('screen').innerHTML=
    '<h1>💀 Game Over!</h1>'+
    '<p>🏆 Score: '+score+' | 🪙 Coins: '+coins+'</p>'+
    '<p>👑 Best: '+best+'</p>'+
    '<button class="big-btn" onclick="startGame()" style="background:linear-gradient(45deg,#FFD700,#FF8C00);color:black;">▶ Play Again</button>';
  document.getElementById('screen').style.display='flex';
}

// Animation loop
function animate(){
  requestAnimationFrame(animate);
  if(!running){
    renderer.render(scene, camera);
    return;
  }

  frameCount++;
  animFrame++;

  // Smooth lane change
  playerObj.group.position.x += (targetX - playerObj.group.position.x) * 0.15;

  // Jump physics
  if(isJumping){
    playerObj.group.position.y += jumpVelocity;
    jumpVelocity -= 0.012;
    if(playerObj.group.position.y <= 0.5){
      playerObj.group.position.y = 0.5;
      isJumping = false;
      jumpVelocity = 0;
    }
  }

  // Slide
  if(isSliding){
    playerObj.group.scale.y = 0.5;
    playerObj.group.position.y = 0.2;
  } else if(!isJumping){
    playerObj.group.scale.y = 1;
    playerObj.group.position.y = 0.5;
  }

  // Running animation
  var legSwing = Math.sin(animFrame * 0.3) * 0.3;
  playerObj.leftLeg.rotation.x = legSwing;
  playerObj.rightLeg.rotation.x = -legSwing;
  playerObj.leftArm.rotation.x = -legSwing;
  playerObj.rightArm.rotation.x = legSwing;

  // Spawn
  if(frameCount % 60 == 0) makeObstacle(Math.floor(Math.random()*3));
  if(frameCount % 35 == 0) makeCoin(Math.floor(Math.random()*3));

  // Move obstacles
  for(var i=obstacles.length-1; i>=0; i--){
    var ob = obstacles[i];
    ob.position.z += speed;

    // Collision check
    var playerH = isSliding ? 0.5 : 1.3;
    var playerY = playerObj.group.position.y;

    if(Math.abs(ob.position.z - playerObj.group.position.z) < 1.5 &&
       Math.abs(ob.position.x - playerObj.group.position.x) < 1.5){

      var obType = ob.userData.type;
      var hit = false;

      if(obType == 'wall' && !isJumping) hit = true;
      else if(obType == 'low' && !isSliding) hit = true;
      else if(obType == 'train') hit = true;

      if(hit){
        lives--;
        updateUI();
        scene.remove(ob);
        obstacles.splice(i, 1);
        if(lives <= 0){
          gameOver();
          return;
        }
        continue;
      }
    }

    if(ob.position.z > 6){
      scene.remove(ob);
      obstacles.splice(i, 1);
      score += 10;
      speed += 0.002;
      updateUI();
    }
  }

  // Move coins
  for(var j=coinMeshes.length-1; j>=0; j--){
    var c = coinMeshes[j];
    c.position.z += speed;
    c.rotation.z += 0.05;

    if(Math.abs(c.position.z - playerObj.group.position.z) < 1.5 &&
       Math.abs(c.position.x - playerObj.group.position.x) < 1.5 &&
       Math.abs(c.position.y - playerObj.group.position.y) < 1.5){
      scene.remove(c);
      coinMeshes.splice(j, 1);
      coins++;
      updateUI();
    }

    if(c.position.z > 6){
      scene.remove(c);
      coinMeshes.splice(j, 1);
    }
  }

  // Camera follow
  camera.position.x += (playerObj.group.position.x - camera.position.x) * 0.05;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
      </html>
