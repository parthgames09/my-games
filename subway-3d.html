<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#000;font-family:Arial;}
#ui{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,0.7);border:2px solid #FFD700;border-radius:15px;padding:8px 20px;display:flex;gap:20px;backdrop-filter:blur(10px);}
.ui-item{text-align:center;}
.ui-label{color:#aaa;font-size:10px;}
.ui-val{font-size:16px;font-weight:bold;}
#screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);}
#screen h1{color:#FFD700;font-size:28px;text-shadow:0 0 20px gold;margin-bottom:10px;}
#screen p{color:#aaa;font-size:14px;margin-bottom:20px;text-align:center;padding:0 20px;}
.big-btn{padding:15px 40px;font-size:20px;border:none;border-radius:25px;cursor:pointer;font-weight:bold;margin:8px;}
#swipe-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,0.4);font-size:12px;text-align:center;}
</style>
</head>
<body>

<div id="ui">
  <div class="ui-item">
    <div class="ui-label">🏆 SCORE</div>
    <div class="ui-val" id="scoreVal" style="color:#FFD700;">0</div>
  </div>
  <div class="ui-item">
    <div class="ui-label">👑 BEST</div>
    <div class="ui-val" id="bestVal" style="color:#FF4D4D;">0</div>
  </div>
  <div class="ui-item">
    <div class="ui-label">🪙 COINS</div>
    <div class="ui-val" id="coinsVal" style="color:#00FF85;">0</div>
  </div>
  <div class="ui-item">
    <div class="ui-label">❤️ LIVES</div>
    <div class="ui-val" id="livesVal" style="color:#FF4D4D;">❤️❤️❤️</div>
  </div>
</div>

<div id="screen">
  <h1>🏃 Subway Run!</h1>
  <p>Swipe to play!<br>👈 Left &nbsp; 👉 Right<br>👆 Jump &nbsp; 👇 Slide</p>
  <button class="big-btn" onclick="startGame()" style="background:linear-gradient(45deg,#FFD700,#FF8C00);color:black;">▶ START GAME</button>
</div>

<div id="swipe-hint">👆 Swipe to Jump | 👇 Slide | 👈👉 Move</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Scene
var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87CEEB, 0.02);

var camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 8);
camera.lookAt(0, 1, 0);

var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
var sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
sunLight.position.set(10, 20, 10);
sunLight.castShadow = true;
scene.add(sunLight);

// Sky
var skyMat = new THREE.MeshBasicMaterial({color:0x87CEEB, side:THREE.BackSide});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(500,32,32), skyMat));

// Ground
var ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20,1000),
  new THREE.MeshLambertMaterial({color:0x808080})
);
ground.rotation.x = -Math.PI/2;
ground.position.set(0,-0.5,-490);
ground.receiveShadow = true;
scene.add(ground);

// Road lines
[-1.5,1.5].forEach(function(x){
  var line = new THREE.Mesh(
    new THREE.BoxGeometry(0.15,0.02,1000),
    new THREE.MeshLambertMaterial({color:0xFFFFFF})
  );
  line.position.set(x,-0.48,-490);
  scene.add(line);
});

// Road borders
[-5,5].forEach(function(x){
  var wall = new THREE.Mesh(
    new THREE.BoxGeometry(0.3,0.5,1000),
    new THREE.MeshLambertMaterial({color:0xFF4D4D})
  );
  wall.position.set(x,-0.25,-490);
  scene.add(wall);
});

// Buildings
function makeBuilding(x,z){
  var h = 5+Math.random()*15;
  var colors = [0x4a4a8a,0x6a6a4a,0x8a4a4a,0x4a8a4a,0x8a8a4a];
  var building = new THREE.Mesh(
    new THREE.BoxGeometry(3+Math.random()*2,h,3+Math.random()*2),
    new THREE.MeshLambertMaterial({color:colors[Math.floor(Math.random()*colors.length)]})
  );
  building.position.set(x,h/2-0.5,z);
  building.castShadow = true;
  scene.add(building);

  // Windows
  var winMat = new THREE.MeshBasicMaterial({color:0xFFFF88});
  for(var i=0;i<3;i++){
    for(var j=0;j<Math.floor(h/2);j++){
      var win = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.1), winMat);
      win.position.set(x+(i-1)*0.8, j*1.5+0.5, z+1.6);
      scene.add(win);
    }
  }
}

for(var i=0;i<20;i++){
  makeBuilding(-8-Math.random()*3,-i*15);
  makeBuilding(8+Math.random()*3,-i*15);
}

// Player
function makePlayer(){
  var player = new THREE.Group();

  var body = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.8,0.4), new THREE.MeshLambertMaterial({color:0xFF4500}));
  body.position.y = 0.4; body.castShadow = true; player.add(body);

  var head = new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8), new THREE.MeshLambertMaterial({color:0xFFCC80}));
  head.position.y = 1.1; head.castShadow = true; player.add(head);

  var hair = new THREE.Mesh(new THREE.SphereGeometry(0.27,8,4,0,Math.PI*2,0,Math.PI/2), new THREE.MeshLambertMaterial({color:0x333333}));
  hair.position.y = 1.2; player.add(hair);

  var eyeMat = new THREE.MeshBasicMaterial({color:0x000000});
  var leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.05,6,6), eyeMat);
  leftEye.position.set(-0.1,1.15,0.22); player.add(leftEye);
  var rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.05,6,6), eyeMat);
  rightEye.position.set(0.1,1.15,0.22); player.add(rightEye);

  var armMat = new THREE.MeshLambertMaterial({color:0xFF4500});
  var leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.6,0.2), armMat);
  leftArm.position.set(-0.4,0.4,0); player.add(leftArm);
  var rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.6,0.2), armMat);
  rightArm.position.set(0.4,0.4,0); player.add(rightArm);

  var legMat = new THREE.MeshLambertMaterial({color:0x1565C0});
  var leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.6,0.25), legMat);
  leftLeg.position.set(-0.18,-0.3,0); player.add(leftLeg);
  var rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.6,0.25), legMat);
  rightLeg.position.set(0.18,-0.3,0); player.add(rightLeg);

  var shoeMat = new THREE.MeshLambertMaterial({color:0x333333});
  var leftShoe = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.15,0.35), shoeMat);
  leftShoe.position.set(-0.18,-0.65,0.05); player.add(leftShoe);
  var rightShoe = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.15,0.35), shoeMat);
  rightShoe.position.set(0.18,-0.65,0.05); player.add(rightShoe);

  return {group:player, leftArm:leftArm, rightArm:rightArm, leftLeg:leftLeg, rightLeg:rightLeg};
}

var playerObj = makePlayer();
scene.add(playerObj.group);
playerObj.group.position.set(0,0.5,3);

// Game vars
var score=0,best=0,coins=0,lives=3;
var running=false, speed=0.2;
var playerLane=1, laneX=[-3,0,3], targetX=0;
var isJumping=false, isSliding=false, jumpVelocity=0;
var obstacles=[], coinMeshes=[];
var frameCount=0, animFrame=0;

// SWIPE CONTROLS
var touchStartX=0, touchStartY=0;

document.addEventListener('touchstart', function(e){
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});

document.addEventListener('touchend', function(e){
  if(!running) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  var absDx = Math.abs(dx);
  var absDy = Math.abs(dy);

  if(Math.max(absDx, absDy) < 20) return; // too small

  if(absDx > absDy){
    // Horizontal swipe
    if(dx < 0) moveLeft();
    else moveRight();
  } else {
    // Vertical swipe
    if(dy < 0) jump();
    else slide();
  }
}, {passive:true});

// Keyboard controls too
document.addEventListener('keydown', function(e){
  if(!running) return;
  if(e.key=='ArrowLeft') moveLeft();
  if(e.key=='ArrowRight') moveRight();
  if(e.key=='ArrowUp') jump();
  if(e.key=='ArrowDown') slide();
});

function moveLeft(){
  if(playerLane<=0) return;
  playerLane--; targetX=laneX[playerLane];
}
function moveRight(){
  if(playerLane>=2) return;
  playerLane++; targetX=laneX[playerLane];
}
function jump(){
  if(isJumping||isSliding) return;
  isJumping=true; jumpVelocity=0.2;
}
function slide(){
  if(isJumping||isSliding) return;
  isSliding=true;
  setTimeout(function(){isSliding=false;},600);
}

// Obstacles
function makeObstacle(lane){
  var type = Math.floor(Math.random()*3);
  var ob = new THREE.Group();

  if(type==0){
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(2.5,1.5,0.5), new THREE.MeshLambertMaterial({color:0x8B4513}));
    mesh.castShadow=true; ob.add(mesh);
    ob.userData.type='wall';
  } else if(type==1){
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(2.5,0.4,0.5), new THREE.MeshLambertMaterial({color:0xFF4D4D}));
    mesh.position.y=0.8; ob.add(mesh);
    ob.userData.type='low';
  } else {
    var trainMesh = new THREE.Mesh(new THREE.BoxGeometry(2.2,2,3), new THREE.MeshLambertMaterial({color:0x1565C0}));
    trainMesh.position.y=0.5; ob.add(trainMesh);
    var winMat = new THREE.MeshBasicMaterial({color:0xFFFF88});
    for(var i=0;i<3;i++){
      var win = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.1),winMat);
      win.position.set(-0.6+i*0.6,0.8,1.6); ob.add(win);
    }
    ob.userData.type='train';
  }

  ob.position.set(laneX[lane],0,-30);
  scene.add(ob); obstacles.push(ob);
}

function makeCoin(lane){
  var coin = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3,0.3,0.1,12),
    new THREE.MeshLambertMaterial({color:0xFFD700, emissive:0x443300})
  );
  coin.rotation.x=Math.PI/2;
  coin.position.set(laneX[lane],0.8,-30);
  scene.add(coin); coinMeshes.push(coin);
}

function updateUI(){
  document.getElementById('scoreVal').innerHTML=score;
  document.getElementById('bestVal').innerHTML=best;
  document.getElementById('coinsVal').innerHTML=coins;
  var h='';
  for(var i=0;i<lives;i++) h+='❤️';
  document.getElementById('livesVal').innerHTML=h;
}

function startGame(){
  score=0; coins=0; lives=3; speed=0.2;
  running=true; playerLane=1; targetX=0; frameCount=0;
  isJumping=false; isSliding=false; jumpVelocity=0;
  obstacles.forEach(function(o){scene.remove(o);}); obstacles=[];
  coinMeshes.forEach(function(c){scene.remove(c);}); coinMeshes=[];
  playerObj.group.position.set(0,0.5,3);
  document.getElementById('screen').style.display='none';
  document.getElementById('swipe-hint').style.display='block';
  updateUI();
}

function gameOver(){
  running=false;
  if(score>best) best=score;
  document.getElementById('swipe-hint').style.display='none';
  document.getElementById('screen').innerHTML=
    '<h1>💀 Game Over!</h1>'+
    '<p>🏆 Score: '+score+' | 🪙 Coins: '+coins+'</p>'+
    '<p>👑 Best: '+best+'</p>'+
    '<button class="big-btn" onclick="startGame()" style="background:linear-gradient(45deg,#FFD700,#FF8C00);color:black;">▶ Play Again</button>';
  document.getElementById('screen').style.display='flex';
}

function animate(){
  requestAnimationFrame(animate);
  if(!running){ renderer.render(scene,camera); return; }

  frameCount++; animFrame++;

  playerObj.group.position.x += (targetX-playerObj.group.position.x)*0.15;

  // Jump physics
  if(isJumping){
    playerObj.group.position.y += jumpVelocity;
    jumpVelocity -= 0.012;
    if(playerObj.group.position.y<=0.5){
      playerObj.group.position.y=0.5;
      isJumping=false; jumpVelocity=0;
    }
  }

  // Slide
  if(isSliding){
    playerObj.group.scale.y=0.5;
    playerObj.group.position.y=0.2;
  } else if(!isJumping){
    playerObj.group.scale.y=1;
    playerObj.group.position.y=0.5;
  }

  // Running animation
  var swing = Math.sin(animFrame*0.3)*0.3;
  playerObj.leftLeg.rotation.x=swing;
  playerObj.rightLeg.rotation.x=-swing;
  playerObj.leftArm.rotation.x=-swing;
  playerObj.rightArm.rotation.x=swing;

  // Spawn
  if(frameCount%60==0) makeObstacle(Math.floor(Math.random()*3));
  if(frameCount%35==0) makeCoin(Math.floor(Math.random()*3));

  // Move obstacles
  for(var i=obstacles.length-1;i>=0;i--){
    var ob=obstacles[i];
    ob.position.z+=speed;

    if(Math.abs(ob.position.z-playerObj.group.position.z)<1.5&&
       Math.abs(ob.position.x-playerObj.group.position.x)<1.5){
      var hit=false;
      if(ob.userData.type=='wall'&&!isJumping) hit=true;
      else if(ob.userData.type=='low'&&!isSliding) hit=true;
      else if(ob.userData.type=='train') hit=true;

      if(hit){
        lives--;
        updateUI();
        scene.remove(ob);
        obstacles.splice(i,1);
        if(lives<=0){ gameOver(); return; }
        continue;
      }
    }

    if(ob.position.z>6){
      scene.remove(ob); obstacles.splice(i,1);
      score+=10; speed+=0.002; updateUI();
    }
  }

  // Move coins
  for(var j=coinMeshes.length-1;j>=0;j--){
    var c=coinMeshes[j];
    c.position.z+=speed;
    c.rotation.z+=0.05;

    if(Math.abs(c.position.z-playerObj.group.position.z)<1.5&&
       Math.abs(c.position.x-playerObj.group.position.x)<1.5){
      scene.remove(c); coinMeshes.splice(j,1);
      coins++; updateUI();
    }
    if(c.position.z>6){ scene.remove(c); coinMeshes.splice(j,1); }
  }

  camera.position.x+=(playerObj.group.position.x-camera.position.x)*0.05;
  renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
  </html>
